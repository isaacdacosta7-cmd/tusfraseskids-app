<style>
:root{--ink:#242044;--muted:#756f8b;--purple:#6238d6;--yellow:#ffca40;--orange:#ff884b;--line:#ece8f7;--paper:#fff;--bg:#faf9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 36px));margin:auto}.top{height:76px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.top-inner{height:100%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;line-height:1.08}.brandmark{height:43px;width:43px;display:grid;place-items:center;border-radius:15px;background:#f0eaff;font-size:25px}.brand small{color:var(--purple);font-size:10px;letter-spacing:2.3px}.btn{border:0;border-radius:15px;padding:13px 19px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--purple);color:white;box-shadow:0 7px 18px #6238d62b}.dark{background:var(--ink);color:#fff}.ghost{background:#f3efff;color:var(--purple)}.outline{background:#fff;color:var(--ink);border:1px solid var(--line)}.sm{font-size:12px;padding:9px 12px;border-radius:11px}.hero{background:radial-gradient(circle at 83% 12%,#fff2bf 0,transparent 40%),linear-gradient(135deg,#f2eaff 0%,#e9faff 100%);overflow:hidden;position:relative}.hero>.wrap{padding:75px 0 76px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:45px}.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:white;color:var(--purple);border:1px solid #e4d8ff;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.3px}.hero h1{font-size:clamp(42px,5.1vw,70px);line-height:1.09;letter-spacing:-3px;margin:20px 0}.hero h1 em{font-style:normal;color:var(--purple)}.lead{font-size:17px;line-height:1.7;color:#5e5874;max-width:550px}.hero-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:430px;margin-left:auto;transform:rotate(5deg)}.hero-tile{height:170px;border-radius:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 16px 35px #2c225621;border:5px solid white}.hero-tile span{font-size:76px;filter:drop-shadow(0 9px 4px #0002)}.hero-tile strong{font-size:13px;text-align:center;padding:0 12px}.scallop{height:18px;background:radial-gradient(circle at 12px 0,transparent 12px,var(--bg) 13px) repeat-x;background-size:24px 18px}.section{padding:57px 0 76px}.section-head{text-align:center;max-width:750px;margin:0 auto 37px}.kicker{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800;color:var(--purple)}h2{font-size:clamp(30px,3vw,44px);letter-spacing:-1.5px;line-height:1.15;margin:11px 0}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 28px #2923470c;transition:transform .22s,box-shadow .22s}.card:hover{transform:translateY(-5px);box-shadow:0 19px 40px #29234721}.cover{height:310px;background:linear-gradient(145deg,var(--c1),var(--c2));display:grid;place-items:center;overflow:hidden;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.cover .emoji{font-size:105px;filter:drop-shadow(0 13px 7px #0003)}.cover .stars{position:absolute;color:#ffffffc0;font-size:55px;right:15px;top:10px}.cover .short-title{position:absolute;bottom:17px;left:14px;right:14px;text-align:center;color:white;font-weight:800;text-shadow:0 2px 7px #0005;font-size:20px}.cover img~.short-title{display:none}.badge{display:inline-flex;align-items:center;gap:5px;background:#fff4cf;color:#8a6200;padding:6px 10px;border-radius:9px;font-size:11px;font-weight:800}.card-body{padding:21px}.card h3{font-size:19px;letter-spacing:-.5px;margin:13px 0 7px;min-height:46px}.card p{font-size:13px;line-height:1.6;color:var(--muted);min-height:42px;margin:0 0 15px}.price-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px;gap:12px}.price{font-size:26px;letter-spacing:-1px;font-weight:800}.price small{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}.featureline{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:30px 0}.feature{display:flex;align-items:center;gap:15px;font-weight:800}.feature .ico{font-size:30px;background:#f7f2ff;padding:14px;border-radius:16px}.feature span{font-size:12px;color:var(--muted);font-weight:500;display:block;margin-top:4px}.cta{margin:60px auto 70px;background:linear-gradient(120deg,#4924ac,#7845e5);color:white;text-align:center;padding:46px 24px;border-radius:28px}.cta h2{margin:0 0 12px}.cta p{color:#e3d8ff}.foot{background:#27213f;padding:28px 0;color:#eee8ff;font-size:12px}.foot .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:15px}.foot a{color:#ffe08a}.overlay{position:fixed;inset:0;background:#1e1639a8;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}.modal{position:relative;max-width:610px;width:100%;max-height:92vh;overflow:auto;background:white;border-radius:24px;padding:32px;box-shadow:0 30px 90px #08021164}.close{position:absolute;right:17px;top:16px;background:#f3efff;border:0;width:36px;height:36px;border-radius:50%;font-size:20px}.modal h2{font-size:30px;margin:0 0 9px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid #ded8ed;background:#fff;border-radius:12px;padding:13px;outline:0;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6238d61d}.pay-note{background:#f8f5ff;border:1px solid #e8ddff;border-radius:14px;padding:14px;white-space:pre-wrap;color:#514568;font-size:13px}.cart-list{display:grid;gap:9px;margin:22px 0}.cart-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:#f7f5ff;border-radius:12px;font-size:13px}.notice{padding:15px;border-radius:14px;background:#fff6db;color:#765515;font-size:13px;line-height:1.55}.success{background:#e8f9f0;color:#1b6140}.error{background:#fff0f0;color:#a52d31}.center{text-align:center}.wide{width:100%}.stat{font-size:12px;color:var(--muted)}.admin-wrap{padding:40px 0 80px}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;margin:20px 0;box-shadow:0 8px 24px #2220440b}.panel h2{font-size:26px}.panel h3{font-size:17px;margin:0}.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.mini-book{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:11px;flex-wrap:wrap}.upload-label{display:inline-block;background:#f3efff;color:var(--purple);padding:9px 13px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;margin:3px}.upload-label input{display:none}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted)}.table-wrap{overflow-x:auto}.status{display:inline-block;padding:5px 8px;border-radius:9px;font-weight:800;font-size:10px;background:#fef2d4;color:#8b6408}.status.approved{background:#dbf8e9;color:#207043}.status.rejected{background:#fff0f0;color:#a23845}.linkbox{font-size:12px;word-break:break-all;padding:12px;border:1px dashed #bb9bf5;border-radius:12px;background:#f8f5ff}.status-page{padding:60px 0;max-width:730px}.order-book{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#f8f5ff;border-radius:12px;margin:10px 0;gap:12px}.loading{padding:80px;text-align:center;color:var(--muted)}.fade{animation:rise .55s ease both}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(max-width:930px){.grid{grid-template-columns:repeat(2,1fr)}.hero>.wrap{grid-template-columns:1fr 0.75fr}.hero-tile{height:145px}.features{gap:12px}}@media(max-width:650px){.top{height:70px}.brand{font-size:13px}.brandmark{height:37px;width:37px;font-size:22px}.hero>.wrap{display:block;padding:50px 0 40px}.hero h1{font-size:43px;letter-spacing:-2px}.lead{font-size:15px}.hero-tiles{margin:30px auto 0;max-width:320px;transform:rotate(1deg)}.hero-tile{height:125px}.hero-tile span{font-size:55px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cover{height:205px}.cover .emoji{font-size:72px}.cover .short-title{font-size:15px}.card-body{padding:12px}.card h3{font-size:14px;min-height:51px}.card p{font-size:11px;min-height:53px}.price{font-size:22px}.price-row{flex-wrap:wrap}.price-row .btn{width:100%}.featureline .features{grid-template-columns:1fr}.modal{padding:24px 19px}.admin-grid{grid-template-columns:1fr}.section{padding:45px 0}.wrap{width:calc(100% - 26px)}}
</style>
</head>
<body><div id="app" class="loading">Preparando las historias…</div>
<script>
(function(){
'use strict';
const API='/api/store',game='https://tusfrasesinspiradoras.vercel.app/juegos';
const palettes=[
['#e9a569','#ffcd75','🏡'],['#8a77ea','#eebf5f','🦁'],['#ffc56b','#f58a73','🌅'],
['#4ca9ec','#6fded5','🐋'],['#ffba64','#eb7d53','🪨'],['#e4ac6b','#e6d38c','❤️']
];
let products=[],config={},cart=[],adminData=null;
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n||0)/100).toFixed(2);
function post(data){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{const v=await r.json();if(!r.ok)throw Error(v.error||'Error en el servidor');return v;});}
function get(action,params){return fetch(API+'?'+new URLSearchParams(Object.assign({action},params||{}))).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||'Error');return x;});}
function shell(body){return '<header class="top"><div class="wrap top-inner"><a class="brand" href="/"><span class="brandmark">📖</span><span>Tus Frases<br>Inspiradoras <small>STORE</small></span></a><div style="display:flex;gap:7px;align-items:center"><a href="'+game+'" class="btn ghost sm">🎮 Juegos</a><button class="btn primary sm" onclick="openCart()">🛍️ <span id="cartNum">'+cart.length+'</span></button></div></div></header>'+body+'<footer class="foot"><div class="wrap"><span>© Tus Frases Inspiradoras · Cuentos bíblicos ilustrados</span><span><a href="'+game+'">Juegos interactivos</a> · <a href="/admin">Administración</a></span></div></footer>';}
function card(p,i){
const palette=palettes[i%palettes.length];
const img=p.has_cover?'<img loading="lazy" alt="'+esc(p.title)+'" src="'+API+'?action=cover&slug='+encodeURIComponent(p.slug)+'">':'<span class="emoji">'+palette[2]+'</span><span class="short-title">'+esc(p.title)+'</span>';
return '<article class="card fade"><div class="cover" style="--c1:'+palette[0]+';--c2:'+palette[1]+'">'+img+'</div><div class="card-body"><span class="badge">📚 '+p.pages+' páginas · PDF ilustrado</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description)+'</p><div class="price-row"><span class="price">'+money(p.price_cents)+' <small>USD</small></span><button class="btn '+(cart.includes(p.slug)?'dark':'primary')+' sm" onclick="toggleCart(\''+p.slug+'\')">'+(cart.includes(p.slug)?'✓ Elegido':'+ Agregar')+'</button></div></div></article>';
}
function store(){
let ready=products.filter(p=>p.ready).length;
app.className='';
app.innerHTML=shell('<section class="hero"><div class="wrap"><div class="fade"><span class="eyebrow">✨ Una aventura bíblica para cada niño</span><h1>Historias que siembran <em>fe y amor.</em></h1><p class="lead">Cuentos bíblicos con ilustraciones espectaculares, actividades para imprimir y juegos interactivos para seguir aprendiendo.</p><a href="#cuentos" class="btn primary">Explorar cuentos ✨</a> <a href="'+game+'" class="btn outline">Conocer los juegos 🎮</a></div><div class="hero-tiles"><div class="hero-tile" style="background:#ffdf8f"><span>🦁</span><strong>Daniel</strong></div><div class="hero-tile" style="background:#acf0e9"><span>🐋</span><strong>Jonás</strong></div><div class="hero-tile" style="background:#efc0eb"><span>🏡</span><strong>Hijo pródigo</strong></div><div class="hero-tile" style="background:#c8c7ff"><span>🪨</span><strong>David</strong></div></div></div></section><div class="scallop"></div><section class="section" id="cuentos"><div class="wrap"><div class="section-head"><span class="kicker">Nuestra colección</span><h2>6 aventuras para descubrir</h2><p class="muted">Cada cuento incluye su historia ilustrada, actividades educativas y una enseñanza especial. Selecciona tus favoritos.</p></div><div class="grid">'+products.map(card).join('')+'</div>'+(ready<6?'<p class="notice center" style="margin-top:22px">Estamos preparando las descargas digitales. Los pedidos estarán disponibles cuando el catálogo quede habilitado.</p>':'')+'</div></section><div class="featureline"><div class="wrap features"><div class="feature"><span class="ico">📱</span><div>Descarga en PDF<span>Lee desde teléfono, tableta o PC</span></div></div><div class="feature"><span class="ico">🎨</span><div>Actividades para imprimir<span>Colorea, resuelve y aprende</span></div></div><div class="feature"><span class="ico">🎮</span><div>Juegos interactivos<span>Continúa las aventuras en línea</span></div></div></div></div><div class="wrap"><div class="cta"><h2>¡La próxima gran aventura comienza aquí!</h2><p>Elige las historias favoritas de tu familia y descubre enseñanzas que perduran.</p><button onclick="openCart()" class="btn" style="background:#ffcb50;color:#2a2240">Ver mis cuentos 🛍️</button></div></div>');
}
window.toggleCart=function(id){cart=cart.includes(id)?cart.filter(x=>x!==id):cart.concat(id);store();document.getElementById('cuentos').scrollIntoView({block:'start'});};
window.openCart=function(){
 const books=products.filter(p=>cart.includes(p.slug));
 showModal('<h2>🛍️ Mis cuentos</h2><p class="muted">Elige los cuentos que deseas adquirir.</p><div class="cart-list">'+(books.length?books.map(x=>'<div class="cart-item"><strong>'+esc(x.title)+'</strong><span>'+money(x.price_cents)+' <button class="btn sm ghost" onclick="removeFromCart(\''+x.slug+'\')">Quitar</button></span></div>').join(''):'<p class="muted">Aún no has elegido cuentos.</p>')+'</div><div class="price-row"><strong>Total</strong><strong class="price">'+money(books.reduce((n,p)=>n+p.price_cents,0))+'</strong></div><div style="height:16px"></div><button class="btn primary wide" '+(!books.length?'disabled':'')+' onclick="checkout()">Continuar a la compra →</button>');
};
window.removeFromCart=id=>{cart=cart.filter(x=>x!==id);store();openCart();};
function showModal(body){document.getElementById('modal')?.remove();const m=document.createElement('div');m.className='overlay';m.id='modal';m.innerHTML='<div class="modal"><button class="close" aria-label="Cerrar" onclick="closeModal()">×</button>'+body+'</div>';m.addEventListener('click',e=>{if(e.target===m)closeModal();});document.body.appendChild(m);}
window.closeModal=function(){document.getElementById('modal')?.remove();};
window.checkout=function(){
 const choices=['pago_movil','transferencia','internacional'].filter(k=>String(config[k]||'').trim());
 if(!config.store_open||!choices.length){showModal('<h2>⏳ Próximamente</h2><p class="muted">Estamos terminando de preparar los métodos de pago y las descargas. Regresa pronto.</p>');return;}
 if(cart.some(x=>!products.find(p=>p.slug===x)?.ready)){showModal('<h2>⏳ En preparación</h2><p class="muted">Uno de los cuentos elegidos todavía está siendo preparado.</p>');return;}
 showModal('<h2>Finalizar compra</h2><p class="muted">Completa tus datos y realiza el pago siguiendo las instrucciones.</p><form id="buyForm"><div class="field"><label>Nombre del comprador</label><input name="name" maxlength="100" required minlength="3"></div><div class="field"><label>Correo electrónico</label><input name="email" type="email" maxlength="160" required></div><div class="field"><label>Método de pago</label><select name="method" id="payMethod" onchange="payDetails()">'+choices.map(k=>'<option value="'+k+'">'+({pago_movil:'Pago Móvil',transferencia:'Transferencia',internacional:'Pago internacional'}[k])+'</option>').join('')+'</select></div><div class="pay-note" id="payDetails"></div><div class="field"><label>Referencia o comprobante de pago (número)</label><input name="reference" minlength="3" maxlength="100" placeholder="Ej. 00458923" required></div><p class="muted" style="font-size:12px">Cada pago será revisado antes de habilitar las descargas. Conserva la información de tu pedido.</p><button class="btn primary wide" id="submitBuy">Registrar pago y solicitar verificación</button></form>');
 payDetails();
 document.getElementById('buyForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submitBuy'),fd=new FormData(e.target);btn.disabled=true;btn.textContent='Registrando…';try{
 const d=await post({action:'checkout',name:fd.get('name'),email:fd.get('email'),method:fd.get('method'),reference:fd.get('reference'),slugs:cart});
 const url=location.origin+'/pedido?id='+encodeURIComponent(d.id)+'&access='+encodeURIComponent(d.access);
 cart=[];showModal('<h2>✅ Pedido registrado</h2><p class="muted">Tu pago quedó pendiente de verificación. Guarda tu enlace privado para revisar el estado de la compra y descargar los cuentos después de su aprobación.</p><div class="linkbox" id="orderLink">'+esc(url)+'</div><div style="height:18px"></div><button class="btn primary wide" onclick="copyOrderLink()">Copiar enlace de mi pedido</button><a class="btn outline wide" style="margin-top:9px" href="'+url+'">Consultar mi pedido</a>');
 }catch(err){alert(err.message);btn.disabled=false;btn.textContent='Registrar pago y solicitar verificación';}});
};
window.payDetails=function(){const k=document.getElementById('payMethod')?.value;const el=document.getElementById('payDetails');if(el)el.textContent=String(config[k]||'');};
window.copyOrderLink=function(){const s=document.getElementById('orderLink')?.textContent||'';navigator.clipboard.writeText(s).then(()=>alert('Enlace copiado.'));};
async function statusPage(){
 const u=new URL(location.href),id=u.searchParams.get('id')||'',access=u.searchParams.get('access')||'';
 app.className='';
 app.innerHTML=shell('<main class="wrap status-page"><div class="panel"><h2>📦 Estado de tu compra</h2><div class="loading">Consultando pedido…</div></div></main>');
 try{const d=await get('order',{id,access});const status=d.order.status;
 let statusText=status==='approved'?'✅ Pago verificado. ¡Tus cuentos están listos!':status==='rejected'?'⚠️ El comprobante requiere revisión. Contacta a la tienda.':'⏳ Pago pendiente de verificación.';
 const rows=d.items.map(x=>'<div class="order-book"><strong>'+esc(x.title)+'</strong>'+(status==='approved'?'<a class="btn primary sm" href="'+API+'?action=download&id='+encodeURIComponent(id)+'&access='+encodeURIComponent(access)+'&slug='+encodeURIComponent(x.slug)+'">⬇ Descargar PDF</a>':'<span class="stat">PDF al aprobar</span>')+'</div>').join('');
 app.innerHTML=shell('<main class="wrap status-page"><div class="panel"><span class="kicker">Tus Frases Inspiradoras Store</span><h2>📦 Tu pedido</h2><div class="notice '+(status==='approved'?'success':'')+'">'+statusText+'</div><p class="muted">Referencia de pedido: <strong>'+esc(id)+'</strong></p>'+rows+'<p class="muted" style="font-size:12px">Este enlace es privado. Guárdalo para acceder a tus archivos cuando el pago esté aprobado.</p>'+(status==='pending'?'<button class="btn ghost" onclick="location.reload()">🔄 Actualizar estado</button>':'')+' <a class="btn outline" href="/">Volver al catálogo</a></div></main>');
 }catch(e){app.innerHTML=shell('<main class="wrap status-page"><div class="panel"><h2>Enlace inválido</h2><p class="muted">'+esc(e.message)+'</p><a href="/" class="btn primary">Ver cuentos</a></div></main>');}
}
async function adminPage(){
 app.className='';app.innerHTML=shell('<main class="wrap admin-wrap"><h1>🔐 Administración Store</h1><div id="adminArea" class="panel"><p class="muted">Verificando acceso…</p></div></main>');
 await refreshAdmin();
}
async function refreshAdmin(){
 try{adminData=await get('admin-state');renderAdmin();}
 catch(e){document.getElementById('adminArea').innerHTML='<h2>Acceso administrativo</h2><p class="muted">Ingresa la clave privada para administrar tus cuentos, pagos y pedidos.</p><form id="loginForm"><div class="field"><label>Clave de administrador</label><input name="password" type="password" required autofocus></div><button class="btn primary">Entrar al panel</button></form><p id="loginError" class="muted"></p>';document.getElementById('loginForm').onsubmit=async ev=>{ev.preventDefault();try{await post({action:'login',password:new FormData(ev.target).get('password')});refreshAdmin();}catch(err){document.getElementById('loginError').textContent=err.message;}};}
}
function renderAdmin(){
 const x=adminData,s=x.settings,p=x.products,o=x.orders;
 document.getElementById('adminArea').outerHTML='<div id="adminArea"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2>Panel de la tienda</h2><p class="muted">Productos, ventas y verificación de pagos</p></div><button class="btn ghost sm" onclick="logout()">Salir</button></div><div class="features" style="grid-template-columns:repeat(3,1fr)"><div><strong style="font-size:28px">'+p.length+'</strong><span class="stat" style="display:block">Cuentos</span></div><div><strong style="font-size:28px">'+o.length+'</strong><span class="stat" style="display:block">Pedidos</span></div><div><strong style="font-size:28px">'+o.filter(v=>v.status==='pending').length+'</strong><span class="stat" style="display:block">Pendientes</span></div></div></div><div class="panel"><h2>💳 Métodos de pago</h2><form id="settingsForm"><div class="admin-grid">'+[['pago_movil','Pago Móvil'],['transferencia','Transferencia bancaria'],['internacional','Pago internacional'],['whatsapp','WhatsApp de soporte (opcional)']].map(z=>'<div class="field"><label>'+z[1]+'</label><textarea name="'+z[0]+'" rows="3" maxlength="600" placeholder="Instrucciones de pago">'+esc(s[z[0]])+'</textarea></div>').join('')+'</div><div class="field"><label><input type="checkbox" name="store_open" '+(s.store_open?'checked':'')+' style="width:16px"> Habilitar recepción de pedidos</label></div><p class="muted" style="font-size:12px">Activa las compras después de cargar los seis PDF y confirmar las cuentas de cobro.</p><button class="btn primary">Guardar configuración</button></form></div><div class="panel"><h2>📚 Biblioteca privada</h2><p class="muted">Carga el PDF optimizado y la imagen de portada de cada cuento. Los PDF quedan protegidos en Vercel Blob.</p>'+p.map(v=>'<div class="mini-book"><div><strong>'+esc(v.title)+'</strong><br><span class="stat">PDF: '+(v.pdf_path?'✅ cargado':'⏳ pendiente')+' · Portada: '+(v.cover_path?'✅ cargada':'⏳ pendiente')+'</span><br><span class="stat">Precio $</span> <input id="price-'+v.slug+'" type="number" step="0.01" min="1" max="100" value="'+(v.price_cents/100).toFixed(2)+'" style="width:68px"><button class="btn sm ghost" onclick="savePrice(\''+v.slug+'\')">Actualizar</button></div><div><label class="upload-label">📄 Subir PDF<input type="file" accept="application/pdf,.pdf" onchange="uploadAsset(this,\''+v.slug+'\',\'pdf\')"></label><label class="upload-label">🖼️ Portada JPG<input type="file" accept="image/jpeg,.jpg,.jpeg" onchange="uploadAsset(this,\''+v.slug+'\',\'cover\')"></label></div></div>').join('')+'</div><div class="panel"><h2>🧾 Pedidos recientes</h2><div class="table-wrap"><table class="table"><thead><tr><th>Comprador</th><th>Cuentos</th><th>Pago</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'+(o.length?o.map(v=>'<tr><td><strong>'+esc(v.customer_name)+'</strong><br>'+esc(v.customer_email)+'<br><span class="stat">'+new Date(v.created_at).toLocaleDateString('es-VE')+'</span></td><td>'+v.items.map(i=>esc(i.title)).join('<br>')+'<br><strong>'+money(v.total_cents)+'</strong></td><td>'+esc(v.payment_method)+'<br>Ref. '+esc(v.payment_reference)+'</td><td><span class="status '+v.status+'">'+esc(v.status)+'</span></td><td>'+(v.status==='pending'?'<button class="btn sm primary" onclick="reviewOrder(\''+v.id+'\',\'approved\')">Aprobar</button> <button class="btn sm outline" onclick="reviewOrder(\''+v.id+'\',\'rejected\')">Rechazar</button>':'Procesado')+'</td></tr>').join(''):'<tr><td colspan="5">Todavía no hay pedidos.</td></tr>')+'</tbody></table></div></div></div>';
 document.getElementById('settingsForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{await post({action:'payment-settings',pago_movil:f.get('pago_movil'),transferencia:f.get('transferencia'),internacional:f.get('internacional'),whatsapp:f.get('whatsapp'),store_open:f.has('store_open')});alert('Configuración guardada.');refreshAdmin();}catch(e){alert(e.message);}};
}
window.savePrice=async id=>{const price=Number(document.getElementById('price-'+id).value);try{await post({action:'price',slug:id,price_cents:Math.round(price*100)});alert('Precio actualizado');refreshAdmin();}catch(e){alert(e.message);}};
window.reviewOrder=async(id,status)=>{if(!confirm(status==='approved'?'¿Confirmaste que el dinero ingresó realmente?':'¿Rechazar este comprobante?'))return;try{await post({action:'review',id,status});refreshAdmin();}catch(e){alert(e.message);}};
window.logout=async()=>{await post({action:'logout'});refreshAdmin();};
window.uploadAsset=async(input,book,kind)=>{
 const file=input.files?.[0];if(!file)return;
 if(kind==='pdf'&&file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){alert('Debes elegir un PDF.');return;}
 if(kind==='cover'&&!/\.jpe?g$/i.test(file.name)){alert('Debes elegir una portada JPG.');return;}
 const label=input.closest('label'),old=label.textContent;label.style.opacity='.5';label.firstChild.textContent='⏳ Subiendo…';
 try{
 const ticket=await post({action:'upload-ticket',slug:book,kind,size:file.size});
 const upload=await fetch(ticket.url,{method:'PUT',headers:{'Content-Type':kind==='pdf'?'application/pdf':'image/jpeg'},body:file});
 if(!upload.ok)throw Error('La carga del archivo falló ('+upload.status+').');
 await post({action:'save-asset',slug:book,kind,path:ticket.path});
 alert('Archivo cargado y vinculado al cuento.');refreshAdmin();
 }catch(e){alert(e.message);}finally{label.style.opacity='1';input.value='';}
};
const path=location.pathname;
if(path==='/admin'){adminPage();}
else if(path==='/pedido'){statusPage();}
else{get('catalog').then(v=>{products=v.products;config=v.settings;store();}).catch(e=>{app.innerHTML='<p class="loading">'+esc(e.message)+'</p>';});}
})();
</script>
</body></html>
