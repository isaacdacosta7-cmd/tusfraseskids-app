<script>
(function(){
'use strict';
const API='/api/store',game='https://tusfrasesinspiradoras.vercel.app/juegos';
const palettes=[
['#e9a569','#ffcd75','🏡'],['#8a77ea','#eebf5f','🦁'],['#ffc56b','#f58a73','🌅'],
['#4ca9ec','#6fded5','🐋'],['#ffba64','#eb7d53','🪨'],['#e4ac6b','#e6d38c','❤️']
];
let products=[],config={},cart=[],adminData=null,bundle={price_cents:2400,regular_price_cents:3000,savings_cents:600,discount_percent:20};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n||0)/100).toFixed(2);
function post(data){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{const v=await r.json();if(!r.ok)throw Error(v.error||'Error en el servidor');return v;});}
function get(action,params){return fetch(API+'?'+new URLSearchParams(Object.assign({action},params||{}))).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||'Error');return x;});}
function shell(body){return '<header class="top"><div class="wrap top-inner"><a class="brand" href="/"><span class="brandmark">📖</span><span>Tus Frases<br>Inspiradoras <small>STORE</small></span></a><div style="display:flex;gap:7px;align-items:center"><a href="'+game+'" class="btn ghost sm">🎮 Juegos</a><button class="btn primary sm" onclick="openCart()">🛍️ <span id="cartNum">'+cart.length+'</span></button></div></div></header>'+body+'<footer class="foot"><div class="wrap"><span>© Tus Frases Inspiradoras · Cuentos bíblicos ilustrados</span><span><a href="'+game+'">Juegos interactivos</a> · <a href="/admin">Administración</a></span></div></footer>';}
function card(p,i){
const palette=palettes[i%palettes.length];
const img=p.has_cover?'<img loading="lazy" alt="'+esc(p.title)+'" src="'+API+'?action=cover&slug='+encodeURIComponent(p.slug)+'&v=2" onerror="this.remove()"><span class="emoji">'+palette[2]+'</span><span class="short-title">'+esc(p.title)+'</span>':'<span class="emoji">'+palette[2]+'</span><span class="short-title">'+esc(p.title)+'</span>';

}
function store(){
 const ready=products.filter(p=>p.ready).length;
 const covers=products.slice(0,4).map(p=>'<div class="hero-book"><img loading="lazy" src="'+API+'?action=cover&slug='+encodeURIComponent(p.slug)+'&v=3" alt="'+esc(p.title)+'" onerror="this.style.display=\'none\'"></div>').join('');
 const regular=Number(bundle.regular_price_cents||3000),special=Number(bundle.price_cents||2400),saved=regular-special;
 const offerCovers=products.map(p=>'<div class="offer-cover"><img loading="lazy" alt="'+esc(p.title)+'" src="'+API+'?action=cover&slug='+encodeURIComponent(p.slug)+'&v=3"></div>').join('');
 app.className='';
 app.innerHTML=shell(

function syncCartButtons(){
 const count=document.getElementById('cartNum');
 if(count)count.textContent=String(cart.length);
 document.querySelectorAll('.card button').forEach(btn=>{
  const book=products.find(p=>btn.getAttribute('onclick')==="toggleCart('"+p.slug+"')");
  if(!book)return;
  const chosen=cart.includes(book.slug);
  btn.classList.toggle('dark',chosen);
  btn.classList.toggle('primary',!chosen);
  btn.textContent=chosen?'✓ Elegido':'+ Agregar';
  btn.setAttribute('aria-pressed',String(chosen));
 });
}
window.toggleCart=function(id){
 cart=cart.includes(id)?cart.filter(x=>x!==id):cart.concat(id);

};
function cartQuote(){
 const selected=products.filter(p=>cart.includes(p.slug)),regular=selected.reduce((n,p)=>n+p.price_cents,0);
 const collection=products.length===6&&selected.length===6&&products.every(p=>cart.includes(p.slug));
 const total=collection?Math.min(regular,Number(bundle.price_cents||2400)):regular;
 return {selected,regular,total,collection,saved:regular-total};
}

const proofLimit=8*1024*1024;
function receiptMime(file){
 const allowed=['image/jpeg','image/png','image/webp'];
 const raw=String(file?.type||'').toLowerCase();
 if(allowed.includes(raw))return raw;
 const name=String(file?.name||'').toLowerCase();
 return /\.png$/.test(name)?'image/png':/\.webp$/.test(name)?'image/webp':/\.(jpg|jpeg)$/.test(name)?'image/jpeg':'';
}
async function uploadCustomerProof(file,id,access,onStage){
 const mime=receiptMime(file);
 if(!mime||file.size<100||file.size>proofLimit)throw Error('Adjunta una captura JPG, PNG o WebP de hasta 8 MB.');
 onStage?.('Preparando comprobante…');
 const ticket=await post({action:'proof-ticket',id,access,size:file.size,mime});
 onStage?.('Subiendo tu captura de pago…');
 const result=await fetch(ticket.url,{method:'PUT',headers:{'Content-Type':mime},body:file});
 if(!result.ok)throw Error('Hubo un problema subiendo la captura. Inténtalo nuevamente desde tu pedido.');
 onStage?.('Verificando archivo…');
 await post({action:'proof-save',id,access,path:ticket.path,mime});
 return true;
}
window.previewReceiptFile=function(input){
 const file=input.files?.[0],label=document.getElementById('proofFileName'),image=document.getElementById('proofPreview');
 if(!label||!image)return;
 if(!file){label.textContent='Selecciona una captura o foto del comprobante';image.style.display='none';return;}
 label.textContent='📎 '+file.name+' · '+(file.size/1024/1024).toFixed(2)+' MB';
 image.style.display='block';
 image.src=URL.createObjectURL(file);
};

lass="stat">Precio $</span> <input id="price-'+v.slug+'" type="number" step="0.01" min="1" max="100" value="'+(v.price_cents/100).toFixed(2)+'" style="width:68px"><button class="btn sm ghost" onclick="savePrice(\''+v.slug+'\')">Actualizar</button></div><div><label class="upload-label">📄 Subir PDF<input type="file" accept="application/pdf,.pdf" onchange="uploadAsset(this,\''+v.slug+'\',\'pdf\')"></label><label class="upload-label">🖼️ Portada JPG<input type="file" accept="image/jpeg,.jpg,.jpeg" onchange="uploadAsset(this,\''+v.slug+'\',\'cover\')"></label></div></div>').join('')+'</div><div class="panel"><h2>🧾 Pedidos recientes</h2><div class="table-wrap"><table class="table"><thead><tr><th>Comprador</th><th>Cuentos</th><th>Pago</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>'+(o.length?o.map(v=>'<tr><td><strong>'+esc(v.customer_name)+'</strong><br>'+esc(v.customer_email)+'<br><span class="stat">'+new Date(v.created_at).toLocaleDateString('es-VE')+'</span></td><td>'+v.items.map(i=>esc(i.title)).join('<br>')+'<br><strong>'+money(v.total_cents)+'</strong></td><td>'+esc(v.payment_method)+'<br>Ref. '+esc(v.payment_reference)+'</td><td><span class="status '+v.status+'">'+esc(v.status)+'</span></td><td>'+(v.status==='pending'?'<button class="btn sm primary" onclick="reviewOrder(\''+v.id+'\',\'approved\')">Aprobar</button> <button class="btn sm outline" onclick="reviewOrder(\''+v.id+'\',\'rejected\')">Rechazar</button>':'Procesado')+'</td></tr>').join(''):'<tr><td colspan="5">Todavía no hay pedidos.</td></tr>')+'</tbody></table></div></div></div>';
 document.getElementById('settingsForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{await post({action:'payment-settings',pago_movil:f.get('pago_movil'),transferencia:f.get('transferencia'),internacional:f.get('internacional'),whatsapp:f.get('whatsapp'),store_open:f.has('store_open')});alert('Configuración guardada.');refreshAdmin();}catch(e){alert(e.message);}};
}
window.savePrice=async id=>{const price=Number(document.getElementById('price-'+id).value);try{await post({action:'price',slug:id,price_cents:Math.round(price*100)});alert('Precio actualizado');refreshAdmin();}catch(e){alert(e.message);}};
window.reviewOrder=async(id,status)=>{if(!confirm(status==='approved'?'¿Confirmaste que el dinero ingresó realmente?':'¿Rechazar este comprobante?'))return;try{await post({action:'review',id,status});refreshAdmin();}catch(e){alert(e.message);}};
window.logout=async()=>{await post({action:'logout'});refreshAdmin();};
window.uploadAsset=async(input,book,kind)=>{
 const file=input.files?.[0];if(!file)return;
 if(kind==='pdf'&&file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){alert('Debes elegir un PDF.');return;}
 if(kind==='cover'&&!/\.jpe?g$/i.test(file.name)){alert('Debes elegir una portada JPG.');return;}
 const label=input.closest('label'),old=label.textContent;label.style.opacity='.5';label.firstChild.textContent='⏳ Subiendo…';
 try{
 const ticket=await post({action:'upload-ticket',slug:book,kind,size:file.size});
 const upload=await fetch(ticket.url,{method:'PUT',headers:{'Content-Type':kind==='pdf'?'application/pdf':'image/jpeg'},body:file});
 if(!upload.ok)throw Error('La carga del archivo falló ('+upload.status+').');
 await post({action:'save-asset',slug:book,kind,path:ticket.path});
 alert('Archivo cargado y vinculado al cuento.');refreshAdmin();
 }catch(e){alert(e.message);}finally{label.style.opacity='1';input.value='';}
};
const path=location.pathname;
if(path==='/admin'){adminPage();}
else if(path==='/pedido'){statusPage();}
else{get('catalog').then(v=>{products=v.products;config=v.settings;bundle=v.bundle||bundle;store();}).catch(e=>{app.innerHTML='<p class="loading">'+esc(e.message)+'</p>';});}
})();
</script>
</body></html>
